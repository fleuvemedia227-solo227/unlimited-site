      ${line("Type",r.type==="moto"?"Moto / tricycle":"Automobile")}${line("Garantie",{tiers:"Tiers",tous_risques:"Tous risques"}[d.coverage]||"")}${line("Renouvellement de",d.renew_of)}${line("Véhicule",[d.vehicle_genre,d.vehicle_brand].filter(Boolean).join(" · "))}${line("N° d'immatriculation",d.vehicle_plate)}
      ${d.trailer_type?line(d.trailer_type,[d.trailer_brand,d.trailer_plate].filter(Boolean).join(" · ")):""}${line("Période souhaitée",`${r.months} mois dès le ${fmtD(r.start_date)}`)}</div>
<div class="formgrid"><div><span class="tiny muted">Carte grise</span><div class="docbox" id="dc-card"><div class="spinner"></div></div></div>
<div><span class="tiny muted">Pièce d'identité</span><div class="docbox" id="dc-id"><div class="spinner"></div></div></div></div>
    ${r.insurer_note?`<div class="notice">${esc(r.insurer_note)}</div>`:""}
    ${r.status==="sent"?`<form id="qf" class="col"><p class="small muted" style="margin:0">Le client a seulement envoyé ses photos : recopiez la marque et la plaque lues sur la carte grise.</p><div class="formgrid">
<label class="field">Marque et modèle<input name="vehicle_brand" required value="${esc(d.vehicle_brand||"")}" placeholder="Ex. Toyota Corolla"></label>
<label class="field">N° d'immatriculation<input name="vehicle_plate" required value="${esc(d.vehicle_plate||"")}" placeholder="Ex. 8B-4521"></label>
<label class="field">Genre<select name="vehicle_genre">${[["VP","VP · véhicule particulier"],["VU","VU · utilitaire"],["TPC","Transport public"],["Camion","Camion"],["Bus","Bus / car"],["Moto","Moto / tricycle"]].map(([v,g])=>`<option value="${v}" ${v===(d.vehicle_genre||(r.type==="moto"?"Moto":""))||g===d.vehicle_genre?"selected":""}>${g}</option>`).join("")}</select></label>
<label class="field">Garantie<select name="coverage"><option value="tiers" ${d.coverage!=="tous_risques"?"selected":""}>Tiers</option><option value="tous_risques" ${d.coverage==="tous_risques"?"selected":""}>Tous risques</option></select></label>
<label class="field">N° de police<input name="policy_number" required value="${suggest}"></label>
<label class="field">N° d'attestation (facultatif)<input name="attestation_number"></label>
<label class="field">Prix de la cotisation (FCFA)<input name="price" type="number" min="1" required></label>
<label class="field">Message au client (facultatif)<input name="note" placeholder="Ex. Tous risques, franchise 50 000 FCFA"></label></div>
<button class="btn primary block">Envoyer le prix au client</button></form>`:""}
    ${["sent","quoted"].includes(r.status)?`<details><summary class="small" style="cursor:pointer;color:var(--red);font-weight:700">Refuser la demande</summary>
<form id="rf" class="col" style="margin-top:8px"><label class="field">Motif (visible par le client)<input name="note" required placeholder="Ex. Carte grise illisible, merci de renvoyer une photo"></label>
<button class="btn danger block">Refuser</button></form></details>`:""}
<button class="btn block" data-insmsg="${r.partner_id}:${r.user_id}">✉ Écrire au client</button>`,(sh,close)=>{for(const[k,box]of[["card","dc-card"],["id","dc-id"]])fetch(`/api/admin/insreq/${id}/${k}`,{headers:{authorization:"Bearer "+getToken()}}).then(res=>res.ok?res.blob():Promise.reject()).then(blob=>{const url=URL.createObjectURL(blob),el=sh.querySelector("#"+box);el&&(el.innerHTML=blob.type==="application/pdf"?`<a class="btn small" href="${url}" target="_blank" rel="noopener">Ouvrir le PDF</a>`:`<a href="${url}" target="_blank" rel="noopener"><img src="${url}" alt=""></a>`)}).catch(()=>{const el=sh.querySelector("#"+box);el&&(el.innerHTML='<span class="tiny muted">Photo indisponible</span>')});const qf=sh.querySelector("#qf");qf&&(qf.onsubmit=async e=>{e.preventDefault(),await act("insQuote",{id,...formData(e.target)},"Prix envoyé : le client peut payer dans l'application")&&close()});const rf=sh.querySelector("#rf");rf&&(rf.onsubmit=async e=>{e.preventDefault(),confirm("Refuser cette demande d'assurance ? Le client est prévenu.")&&await act("insReject",{id,...formData(e.target)},"Demande refusée")&&close()})})}function pInsPayments(pid){const db=read(),ids=db.policies.filter(p=>p.partner_id===pid).map(p=>p.id),list=db.insPayments.filter(x=>x.status==="paid"&&ids.includes(x.policy_id)).reverse();$view.innerHTML=`<h1>Encaissements</h1>${partnerKpis(db,pid)}${insRows(db,list,!1)}`}async function installVehicle(id){const r=await act("installVehicle",{id});return r&&r.device_key}function gpsReqRows(db,list){return list.length?`<div class="list">${list.map(v=>{const u=U(db,v.user_id);return`<div class="rc"><div class="main"><b>${esc(v.model||"Véhicule")} · ${esc(v.plate)}${v.fleet>1?` · ${v.fleet} véhicules`:""}</b>
<span class="tiny muted">${esc(u.name)} · ${esc(u.phone)} · ${v.plan==="carburant"?"Géo + Carburant":"Géo Trajet"}${v.tank_liters?` · réservoir ${v.tank_liters} L`:""}</span>
<span class="tiny">Souhaité le <b>${esc(v.install_date||"")}</b> · ${esc(v.install_address||"")}</span>${v.client_note?`<span class="tiny">« ${esc(v.client_note)} »</span>`:""}
      ${v.status==="quoted"?`<span class="tiny">Devis : installation <b>${money(v.install_fee)}</b>${v.quote_monthly?` · abonnement ${money(v.quote_monthly)} / mois`:""}</span>`:""}</div>
<div class="side">${badge("vehicle",v.status)}<button class="btn small primary" data-gq="${v.id}">${v.status==="quoted"?"Modifier le devis":"Envoyer le devis"}</button><button class="btn small" data-gr="${v.id}">Refuser</button></div></div>`}).join("")}</div>`:empty("Aucune demande pour le moment")}function gpsQuoteSheet(v){sheet(`${sheetHead(v.status==="quoted"?"Modifier le devis":"Envoyer le devis")}
<p class="small muted" style="margin:0">${esc(v.model||"Véhicule")} · ${esc(v.plate)}${v.fleet>1?` · ${v.fleet} véhicules`:""} · ${v.plan==="carburant"?"Géo + Carburant":"Géo Trajet"}</p>
<form class="col" id="gqf" style="gap:12px"><div class="formgrid">
<label class="field">Installation (FCFA, payée par le client dans l'app)<input name="install_fee" type="number" min="1" step="1" required value="${v.install_fee||""}"></label>
<label class="field">Abonnement mensuel (FCFA, 0 si inclus)<input name="monthly" type="number" min="0" step="1" value="${v.quote_monthly??""}"></label></div>
<label class="field">Détails du devis (grille, matériel, durée d'engagement, date proposée…)<textarea name="note" rows="4" maxlength="1000">${esc(v.quote_note||"")}</textarea></label>
<button class="btn primary block">Envoyer le devis au client</button></form>`,(sh,close)=>{sh.querySelector("#gqf").onsubmit=async e=>{e.preventDefault(),await act("gpsQuote",{id:v.id,...formData(e.target)},"Devis envoyé : le client le voit dans son application")&&close()}})}function pInstalls(pid){const db=read(),all=db.vehicles.filter(v=>v.partner_id===pid),asked=all.filter(v=>v.status==="quote_requested").reverse(),quoted=all.filter(v=>v.status==="quoted").reverse(),todo=all.filter(v=>v.status==="to_install");$view.innerHTML=`<h1>Demandes et installations</h1>${partnerKpis(db,pid,[["Devis à envoyer",asked.length],["À installer",todo.length],["Véhicules actifs",all.filter(v=>v.status==="active").length]])}
    ${section("Demandes de devis",gpsReqRows(db,asked))}${quoted.length?section("Devis envoyés (le client doit accepter)",gpsReqRows(db,quoted)):""}
    ${section("À installer (devis accepté et payé)",vehicleRows(db,todo,!0))}`;const V=Object.fromEntries(all.map(v=>[v.id,v]));$$("[data-gq]").forEach(b=>b.onclick=()=>gpsQuoteSheet(V[b.dataset.gq])),$$("[data-gr]").forEach(b=>b.onclick=async()=>{const note=prompt("Refuser cette demande. Motif (visible par le client) :");!note||!note.trim()||await act("gpsReject",{id:+b.dataset.gr,note:note.trim()},"Demande refusée, le client est prévenu")&&render()}),$$("[data-inst]").forEach(b=>b.onclick=async()=>{b.disabled=!0;const key=await installVehicle(+b.dataset.inst);if(!key)return render();sheet(`${sheetHead("Installation enregistrée")}<div class="result ok">Le suivi démarre pour le client<span>Saisissez cette clé dans le boîtier GPS. Le boîtier envoie ses positions à l'adresse ${esc(location.origin)}/api/geoloc/track</span></div><p class="code" style="font-size:24px;text-align:center;word-break:break-all">${esc(key)}</p><button class="btn primary block" data-close>Terminé</button>`)})}function pVehicles(pid){const db=read();$view.innerHTML=`<h1>Véhicules suivis</h1>${vehicleRows(db,db.vehicles.filter(v=>v.partner_id===pid&&v.status==="active").reverse(),!1)}`}idleCheck()||render();</script>
<script>"serviceWorker"in navigator&&/^https?:$/.test(location.protocol)&&addEventListener("load",()=>navigator.serviceWorker.register("/sw.js").catch(()=>{})),document.addEventListener("click",e=>{e.target.closest&&e.target.closest("[data-reload]")&&location.reload()});</script>
</body>
